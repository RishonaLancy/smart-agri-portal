apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-portal
  labels:
    app: smart-agri-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-agri-portal
  template:
    metadata:
      labels:
        app: smart-agri-portal
    spec:
      containers:
      - name: web
        image: rishonalancy/smart-agri-portal
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agri-portal-svc
spec:
  type: NodePort
  selector:
    app: smart-agri-portal
  ports:
    - port: 80
      targetPort: 80
